name: Automated Tests (Dev)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3.0"

jobs:
  build-extensions:
    name: Build GDExtension (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x86_64
            target_artifact: addons/fluidsynth/bin/godot_fluidsynth.dll
            platform_init: |
              python scripts/setup_fluidsynth.py --version 2.6.1
            build_cmd: |
              cmake -B build
              cmake --build build --config Release

          - os: ubuntu-latest
            name: GNU+Linux x86_64
            target_artifact: addons/fluidsynth/bin/libgodot_fluidsynth.so
            platform_init: |
              sudo apt-get update
              sudo apt-get install -y libfluidsynth-dev libsndfile1-dev pkg-config cmake
            build_cmd: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release
              cp /usr/lib/x86_64-linux-gnu/libfluidsynth.so* addons/fluidsynth/bin/ 2>/dev/null || true

          - os: macos-latest
            name: Darwin / macOS Universal
            target_artifact: addons/fluidsynth/bin/libgodot_fluidsynth.dylib
            platform_init: |
              brew install fluidsynth libsndfile pkg-config cmake dylibbundler
            build_cmd: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
              cmake --build build --config Release
              dylibbundler -b -x addons/fluidsynth/bin/libgodot_fluidsynth.dylib -d addons/fluidsynth/bin/ -p @loader_path -of || true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Platform Environment
        run: ${{ matrix.platform_init }}

      - name: Build GDExtension
        run: ${{ matrix.build_cmd }}

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-${{ matrix.os }}
          path: addons/fluidsynth/bin/*

  test:
    name: Run Headless Integration Tests (GNU+Linux)
    needs: build-extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth-dev libsndfile1-dev

      - name: Download GNU+Linux Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: gdextension-ubuntu-latest
          path: addons/fluidsynth/bin

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Initialize Godot Project Cache
        run: |
          godot --headless --editor --quit || true

      - name: Run Test Suite
        run: |
          echo "Running MIDI Parser Tests..."
          godot --headless -s tests/test_midi_parser.gd
          echo "Running Main Integration Tests..."
          godot --headless -s tests/test_main_integration.gd
          echo "All tests passed successfully!"
